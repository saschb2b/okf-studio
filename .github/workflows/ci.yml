name: CI

# Fast checks on every push to main and every pull request. The full per-OS
# Tauri build is exercised by release.yml (it needs the platform toolchains and
# a built frontend); CI here stays quick: the whole frontend, and the Rust core.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend fast lane — lint · typecheck · gates · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # The theme gates: `var(--nope)` (invalid at computed-value time, and
      # silent), all 108 AA pairings per theme including ink on the state fills,
      # and the design-system bundle's declared sync with src/styles.css. All
      # three read files and do arithmetic, so they cost seconds and fail before
      # the browser lanes spend minutes.
      - run: pnpm check:theme

      # The release version lives in nine places across four toolchains. Three
      # releases in a row were bumped by hand with nothing checking they agreed,
      # and a disagreement is silent until an installer and the updater manifest
      # claim different numbers.
      - run: pnpm check:version

      # Both knowledge bundles are conformance-checked. docs/ is the product
      # spec AND the app's built-in sample, so a malformed concept ships as
      # content; design-system/ is what the site's styles are generated from.
      - run: node scripts/okf-validate.mjs docs
      - run: node .claude/skills/odsf/odsf-validate.mjs design-system

      - run: pnpm test
      - run: pnpm test:agent-benchmarks
      - run: pnpm build

  frontend-integration:
    name: Frontend integration — full app · axe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  frontend-stories:
    name: Frontend stories — Chromium interactions · visual consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Runs every story's play function AND the visual-consistency audit that
      # .storybook/preview.tsx applies after each one (off-scale gaps, prose with
      # no reading measure, uneven repeated rows, hit targets under 24px, content
      # clipped with no affordance). 86 of 297 stories failed when it was
      # introduced; this is what keeps it at zero.
      - run: pnpm test:stories

  core:
    name: Rust core — clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # okf-core is pure Rust (no Tauri/webkit), so it needs no system libraries
      # and no built frontend — keeping this job fast.
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p okf-core --all-targets -- -D warnings
      - run: cargo test -p okf-core

  native-host:
    name: Native host — clippy · test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Windows exercises the native Tauri host without the Linux WebKitGTK
      # setup used by packaging. This covers ACP process ownership, model
      # endpoints, source intake, staged transactions, and credential mocks.
      - run: cargo clippy -p okf-viewer --all-targets -- -D warnings
      - run: cargo test -p okf-viewer --no-fail-fast

  linux-agent-sandbox:
    name: Linux native host — cfg(unix) tests · sandbox policy
    # The compiled policy denies nested user namespaces via --disable-userns,
    # which needs bubblewrap >= 0.8. Ubuntu 22.04 ships 0.6.1, so this job
    # requires the 24.04 image (bubblewrap 0.9).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install native host and sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libxdo-dev \
            libssl-dev

      - name: Allow unprivileged user namespaces for the probe
        # Ubuntu 24.04 can gate unprivileged user namespaces behind AppArmor;
        # the probe needs them like any unprivileged Bubblewrap launch does.
        # Report the versions the job actually ran against for diagnosis.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          uname -r

      - name: Set up Rust
        # Installs the toolchain pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      # The native host's other run is on Windows, where every cfg(unix) and
      # cfg(target_os = "linux") test is compiled out rather than skipped. Six
      # of those are security boundaries, including symlink escape from a
      # granted folder and the sandbox binary's setuid and ownership trust.
      - name: Test the native host on Linux
        run: cargo test -p okf-viewer --no-fail-fast

      - name: Prove the restricted Bubblewrap mount policy
        run: >-
          cargo test -p okf-viewer
          agent_sandbox::tests::restricted_linux_host_enforces_the_compiled_mount_policy
          -- --exact --ignored
