name: Deploy site to GitHub Pages

# Builds the Astro marketing/download site (site/) and deploys it to GitHub
# Pages at https://saschb2b.github.io/okf-studio/. Pages source must be set to
# "GitHub Actions" in the repo settings.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "design-system/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs deps (auto-detects pnpm from site/pnpm-lock.yaml), runs the
      # `build` script (which syncs the design-system CSS first), and uploads
      # site/dist as the Pages artifact.
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
