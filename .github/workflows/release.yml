name: Release

# When a GitHub Release is published, build the desktop app and attach the
# installers/packages to that release. Create a release (e.g. from a tag like
# v0.1.0) and publish it to trigger this.
on:
  release:
    types: [published]

permissions:
  contents: write # tauri-action uploads the built artifacts to the release

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # .deb links against the *system* libraries, so building on an older
          # base keeps it installable on 22.04 and every newer release.
          - platform: ubuntu-22.04
            label: deb
            args: --bundles deb
          # The AppImage *bundles* glib/Mesa, so build it on the current LTS:
          # a 22.04-bundled AppImage breaks on modern hosts (glib symbol +
          # EGL_BAD_PARAMETER). 26.04 is a preview runner for now.
          - platform: ubuntu-26.04
            label: appimage
            args: --bundles appimage
          # Windows: .msi + NSIS .exe (from the tauri.conf bundle targets).
          - platform: windows-latest
            label: msi+nsis
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 on Linux links against WebKitGTK 4.1 and friends; AppImage needs
      # patchelf. (The official Tauri prerequisites list for Debian/Ubuntu.)
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Runs the Tauri build (frontend via the `beforeBuildCommand`, then bundles
      # the targets in `args`) and uploads the resulting artifacts to the
      # triggering release.
      - name: Build app and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
