name: Release

# When a GitHub Release is published, build the desktop app and attach the
# installers/packages to that release. Create a release (e.g. from a tag like
# v0.1.0) and publish it to trigger this.
on:
  release:
    types: [published]

permissions:
  contents: write # tauri-action uploads the built artifacts to the release

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # .deb links against the *system* libraries, so building on an older
          # base keeps it installable on 22.04 and every newer release. Not an
          # updater target (deb updates go through the system package manager).
          - platform: ubuntu-22.04
            label: deb
            args: --bundles deb
            updaterJson: false
          # The AppImage *bundles* glib/Mesa, so build it on the current LTS:
          # a 22.04-bundled AppImage breaks on modern hosts (glib symbol +
          # EGL_BAD_PARAMETER). 26.04 is a preview runner for now. This is the
          # Linux updater target.
          - platform: ubuntu-26.04
            label: appimage
            args: --bundles appimage
            updaterJson: true
          # Windows: .msi + NSIS .exe (from the tauri.conf bundle targets); NSIS
          # is the updater target.
          - platform: windows-latest
            label: msi+nsis
            args: ""
            updaterJson: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Tauri 2 on Linux links against WebKitGTK 4.1 and friends; AppImage needs
      # patchelf. (The official Tauri prerequisites list for Debian/Ubuntu.)
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Runs the Tauri build (frontend via the `beforeBuildCommand`, then bundles
      # the targets in `args`) and uploads the resulting artifacts to the
      # triggering release.
      - name: Build app and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — set these repo secrets before the first signed
          # release (`pnpm tauri signer generate`); without them the
          # updater-target builds (AppImage, NSIS) fail to sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
          # Generates/merges latest.json (the updater manifest) on the updater
          # target jobs only; the .deb job skips it.
          includeUpdaterJson: ${{ matrix.updaterJson }}

  # Android is a separate job rather than a matrix row: tauri-action bundles
  # desktop targets only, so the APK is built and uploaded by hand. One universal
  # APK carries all four ABIs, so a tablet, a phone, and an emulator take the
  # same file and nobody has to know their own CPU.
  android:
    name: Build Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Gradle 8 with the Android plugin runs on JDK 17 through 21. The runner's
      # default JDK moves with the image, so pin it here rather than inherit it.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the SDK and platform-tools but no NDK, which the
      # Rust cross-compile needs. Pin the NDK version so a runner-image bump
      # cannot silently change the toolchain under the release.
      - name: Install the Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Builds the frontend (the config's beforeBuildCommand), cross-compiles the
      # Rust lib for the four Android ABIs, and assembles one signed universal
      # APK. Signing uses the checked-in debug key (see the app's build.gradle.kts):
      # public, and the same for every release, so an update installs over the
      # last one instead of being refused.
      - name: Build the APK
        run: pnpm tauri android build --apk

      # Named after the release tag, because the Gradle output name carries no
      # version and a downloads folder full of app-universal-release.apk helps
      # nobody.
      - name: Upload the APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          built=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          named="OKF-Studio_${TAG#v}_universal.apk"
          cp "$built" "$named"
          gh release upload "$TAG" "$named" --clobber --repo "$GITHUB_REPOSITORY"
