name: Release

# When a GitHub Release is published, build the desktop app for Windows and
# Ubuntu and attach the installers/packages to that release. Create a release
# (e.g. from a tag like v0.1.0) and publish it to trigger this.
on:
  release:
    types: [published]

permissions:
  contents: write # tauri-action uploads the built artifacts to the release

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 → .deb + .AppImage; windows-latest → .msi + NSIS .exe.
        # 22.04 (older glibc) keeps the Linux packages widely compatible.
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 on Linux links against WebKitGTK 4.1 and friends; AppImage needs
      # patchelf. (The official Tauri prerequisites list for Debian/Ubuntu.)
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Runs the Tauri build (frontend via the `beforeBuildCommand`, then bundles)
      # and uploads the resulting artifacts to the triggering release.
      - name: Build app and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ github.event.release.id }}
