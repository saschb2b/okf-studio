[workspace]
members = ["crates/okf-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps nested frontmatter maps (ODSF `tokens`) in author order
# across IPC, so e.g. color swatches render in the order the author wrote them
# rather than alphabetized.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
