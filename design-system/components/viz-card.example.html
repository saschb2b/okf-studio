<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKF Studio DS · Viz card</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>body{background:var(--colors-bg);color:var(--colors-text);font-family:var(--font-sans);padding:48px;max-width:420px}</style>
</head>
<body>
  <article class="viz-card">
    <figure class="viz-card__media">
      <!-- Stands in for a product screenshot; the site uses 1760x1117 webp shots. -->
      <svg viewBox="0 0 1760 1117" role="img" aria-label="Placeholder screenshot" style="display:block;width:100%;height:100%;background:var(--colors-surface-2)">
        <circle cx="880" cy="558" r="360" fill="none" stroke="var(--colors-border-strong)" stroke-width="8"/>
        <circle cx="760" cy="480" r="140" fill="var(--colors-primary)" opacity="0.7"/>
        <circle cx="1040" cy="640" r="100" fill="var(--colors-secondary)" opacity="0.5"/>
      </svg>
    </figure>
    <div class="viz-card__text">
      <h3 class="viz-card__title">Circle packing</h3>
      <p class="viz-card__body">Groups within groups as nested circles, with a smooth zoom as you drill down and out.</p>
    </div>
  </article>
</body>
</html>
