<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKF Viewer DS · Download grid</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body{background:var(--colors-bg);color:var(--colors-text);font-family:var(--font-sans);padding:var(--space-64) var(--space-24)}
    .dl{max-width:var(--size-container);margin:0 auto;text-align:center}
    .dl__row{display:flex;gap:var(--space-16);justify-content:center;flex-wrap:wrap;margin:var(--space-24) 0}
    .dl__note{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--colors-text-dim)}
  </style>
</head>
<body>
  <section class="dl">
    <span class="eyebrow">Download</span>
    <div class="dl__row">
      <a class="dl-btn" href="#"><span class="dl-btn__glyph">⊞</span><span class="dl-btn__text"><span class="dl-btn__os">Windows</span><span class="dl-btn__meta">.msi · x64</span></span><span class="dl-btn__arrow" aria-hidden="true">↓</span></a>
      <a class="dl-btn" href="#"><span class="dl-btn__glyph">◈</span><span class="dl-btn__text"><span class="dl-btn__os">Linux</span><span class="dl-btn__meta">.deb · AppImage</span></span><span class="dl-btn__arrow" aria-hidden="true">↓</span></a>
    </div>
    <p class="dl__note">v0.2.0 · unsigned for now · <a href="#" style="color:var(--colors-primary)">all releases</a></p>
  </section>
</body>
</html>
