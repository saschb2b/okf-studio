[package]
name = "okf-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OKF Studio — point it at a folder, read your knowledge as a graph."
default-run = "okf-viewer"

[lib]
name = "okf_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "okf-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
okf-core = { path = "../crates/okf-core" }
notify = "6"

# Remote-bundle fetch (Open from URL). Lightweight and blocking — ureq brings
# rustls TLS with no async runtime; flate2 + tar handle GitHub tarballs, zip
# handles .zip archives. No git dependency by design (see src/remote.rs).
ureq = "2"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Opt-in update check against the latest GitHub release (see
# docs/architecture/build-and-release.md). process is needed to relaunch after
# an update. Desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Linux only: disable WebKitGTK's native trackpad pinch-zoom (it bypasses the JS
# guards that cover WebView2/WKWebView — see src/native.ts). Versions pinned to
# wry's, so the WebView/GTK types unify with the ones Tauri hands us; gtk brings
# the matching glib (re-exported as gtk::glib).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
gtk = "=0.18.2"
