[package]
name = "okf-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OKF Viewer — point it at a folder, read your knowledge as a graph."
default-run = "okf-viewer"

[lib]
name = "okf_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "okf-viewer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
okf-core = { path = "../crates/okf-core" }
notify = "6"

# Opt-in update check against the latest GitHub release (see
# docs/architecture/build-and-release.md). process is needed to relaunch after
# an update. Desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
