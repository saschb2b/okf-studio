<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- App tile: 896x896 inside a 1024 canvas -> a 64px transparent safe-area
       gutter (macOS icons need padding; the mask is not auto-applied). Corner
       radius 144 (~16% of the tile): softer than the 22.5% macOS squircle,
       tighter than a full-bleed rounding. -->
  <rect x="64" y="64" width="896" height="896" rx="144" fill="#141518"/>
  <!-- Folder + three fanned sheets, scaled to fill ~74% of the tile. -->
  <g transform="translate(512 513) scale(1.20) translate(-512 -513)">
    <rect x="236" y="292" width="232" height="118" rx="30" fill="#868C94"/>
    <rect x="236" y="350" width="552" height="384" rx="44" fill="#868C94"/>
    <rect x="300" y="372" width="352" height="232" rx="20" fill="#C7CCD1"/>
    <rect x="344" y="350" width="352" height="254" rx="20" fill="#E2E5E9"/>
    <rect x="388" y="326" width="352" height="278" rx="20" fill="#FFFFFF"/>
    <rect x="236" y="480" width="552" height="254" rx="44" fill="#BFC5CC"/>
  </g>
</svg>
